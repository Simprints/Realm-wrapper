name: Publish package to GitHub Packages
on:
  workflow_dispatch:
  release:
    types: [ published ]
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'adopt'

      # build the realmwrapper aar
      - name: build wrapper package
        run: gradle realmwrapper:assemble
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ secrets.GITHUB_ACTOR }}

      - name: Publish wrapper package
        run: gradle realmwrapper:publish --stacktrace
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}